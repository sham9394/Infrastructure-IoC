global:
  scrape_interval: 5s

scrape_configs:

  # Monitor Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # Monitor Kubernetes master node through node_exporter (inside docker)
  - job_name: 'node-master'
    static_configs:
      - targets: ['nodeexporter:9100']

  # Monitor containers running on Kubernetes master (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Monitor ALL Kubernetes nodes (external node_exporter)
  - job_name: 'k8s-nodes'
    static_configs:
      - targets:
        - '13.204.53.99:9100'   # K8s master
        - '15.207.107.89:9100'   # K8s node1
        - '43.204.216.161:9100'    # K8s node2

  # Monitor Jenkins master Prometheus endpoint
  - job_name: 'jenkins-master'
    metrics_path: /prometheus
    static_configs:
      - targets: ['3.110.161.245:8080']  # jenkins server IP

  # Monitor Jenkins master system metrics
  - job_name: 'jenkins-master-node'
    static_configs:
      - targets: ['3.110.161.245:9100'] # jenkins server IP

  # Monitor Jenkins Agent system metrics
  - job_name: 'jenkins-agent'
    static_configs:
      - targets:
        - '13.204.53.99:9100'   # Jenkins Agent1
